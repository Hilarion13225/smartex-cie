spring:
  application:
    name: smart-prepaid-poc-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cie_smart_prepaid_poc}
    username: ${DB_USER:poc_user}
    password: ${DB_PASSWORD:poc_password}
  jpa:
    hibernate:
      ddl-auto: validate # le schéma est piloté par Flyway, jamais par Hibernate en PoC/prod
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: poc-backend-gateway
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  command-ttl-seconds: 60
  qos: 1
  # mTLS (§12_Securite): utilisés seulement si broker-url commence par ssl://.
  ca-cert-path: ${MQTT_CA_CERT_PATH:}
  client-cert-path: ${MQTT_CLIENT_CERT_PATH:}
  client-key-path: ${MQTT_CLIENT_KEY_PATH:}

meter-adapter:
  mock-dongle-base-url: ${MOCK_DONGLE_BASE_URL:http://localhost:9001}

# Domaine customer/auth (voir docs/05_reconciliation-api-frontend-backend.md §8).
# Secret de LABORATOIRE par défaut (même convention que DB_PASSWORD) : à
# surcharger via JWT_SECRET pour tout environnement au-delà du PoC local.
jwt:
  secret: ${JWT_SECRET:cie-lab-poc-jwt-secret-do-not-use-in-production-change-me}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  pattern:
    console: "%d{ISO8601} [%X{correlationId:-no-correlation}] %-5level %logger{36} - %msg%n"
