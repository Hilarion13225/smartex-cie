# Mosquitto - configuration PoC Laboratoire DURCIE: mTLS + ACL par device
# (voir docs/02_developer-pack-poc.md §10_MQTT et §12_Securite).
#
# ATTENTION: certificats de LABORATOIRE auto-signés, générés par
# infra/mosquitto/generate-lab-certs.sh -- JAMAIS à réutiliser tels quels en
# pré-production ou en production CIE (voir avertissement dans ce script).
#
# Identité mTLS: use_identity_as_username fait porter le CN du certificat
# client comme "username" MQTT, utilisé ensuite par acl.conf pour isoler
# chaque device (aucun mot de passe séparé à gérer).

listener 8883
protocol mqtt

cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
require_certificate true
use_identity_as_username true

allow_anonymous false
acl_file /mosquitto/config/acl.conf

persistence true
persistence_location /mosquitto/data/
log_dest stdout
