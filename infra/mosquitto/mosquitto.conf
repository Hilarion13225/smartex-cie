# Mosquitto - configuration PoC Laboratoire (dev local, sans TLS).
# ATTENTION: en environnement labo/pré-prod CIE réel, activer TLS mutuel +
# ACL par device (voir docs/02_developer-pack-poc.md §12_Securite) avant tout
# raccordement à du matériel réel. Ce fichier est volontairement permissif
# pour accélérer les itérations de développement.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest stdout
