# ACL mosquitto - PoC Laboratoire (voir docs/02_developer-pack-poc.md §10_MQTT
# et §12_Securite). Politique deny-by-default: mosquitto refuse tout ce qui
# n'est pas explicitement autorisé ci-dessous.
#
# L'identité de chaque client est le CN de son certificat mTLS
# (use_identity_as_username true dans mosquitto.conf) -- pas un mot de passe.

# Gateway backend: publie les commandes de token vers tous les devices du
# labo et écoute l'ACK de tous les devices (corrélation par commandId).
user backend-gateway
topic write cie/lab/+/command/token
topic read cie/lab/+/ack

# Dongles/compteurs labo: isolation stricte par identité. %u est substitué
# par le CN du certificat du client connecté (ex: DONGLE-LAB-0001). Cette
# règle "pattern" s'applique à toute identité authentifiée autre que
# backend-gateway -- un dongle ne peut donc JAMAIS lire la commande d'un
# autre device, ni publier sur son topic d'ACK (test de sécurité C02).
pattern read cie/lab/%u/command/token
pattern write cie/lab/%u/ack
