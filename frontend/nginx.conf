server {
    listen 80;
    server_name _;

    # Defi ACME (renouvellement Let's Encrypt, voir infra/certbot-renew.sh) : doit rester
    # servi en clair sur 80 meme apres bascule HTTPS, jamais redirige.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tout le reste : redirige vers HTTPS (certificat obtenu, voir infra/certbot-renew.sh).
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name poc.smartexdigit.com;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/poc.smartexdigit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poc.smartexdigit.com/privkey.pem;

    # SPA (React Router BrowserRouter) : toute route inconnue retombe sur index.html,
    # le routage cote client fait le reste.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy vers le backend (reseau Docker interne, jamais publie sur l'hote --
    # voir docker-compose.prod.yml) : evite d'avoir a ouvrir un second port public (le
    # pare-feu infrastructure IONOS, distinct de ufw/Docker, ne laissait passer que 80/22
    # lors du deploiement de demo) et rend frontend/backend same-origin du point de vue du
    # navigateur, donc aucun CORS a configurer pour ce cas.
    location /api/v1/ {
        proxy_pass http://backend:8080/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
