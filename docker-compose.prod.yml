# Override de déploiement (démo VPS, IP brute -- voir README §Déploiement démo).
# Usage : docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# Ne modifie PAS docker-compose.yml (workflow de dev local inchangé) : ajoute le service
# frontend (absent en dev, où l'on utilise `npm run dev`) et ne publie plus du tout sur
# l'hôte les ports qui n'ont aucune raison d'être joignables depuis internet (postgres,
# mosquitto, mock-dongle, payment-simulator -- seuls consommés en interne par les autres
# conteneurs, qui se joignent par nom de service sur le réseau Docker interne, indépendamment
# de toute publication de port). `ports: []` remplace entièrement la liste de la base (les
# séquences ne sont jamais fusionnées entre fichiers compose, contrairement aux maps) --
# nécessaire même si le pare-feu (ufw) bloque déjà ces ports : Docker manipule iptables
# directement pour ses ports publiés, ce qui contourne ufw par défaut, voir
# https://github.com/chaifeng/ufw-docker. Ne pas essayer de republier sur 127.0.0.1 à la
# place : cette variante déclenche une race condition reproductible dans le démon Docker
# observée sur ce VPS (des conteneurs sans lien entre eux se voient "Recreate" en boucle et
# le bind échoue aléatoirement en "address already in use" alors que le port est libre).

services:
  postgres:
    ports: !reset []

  mosquitto:
    ports: !reset []

  mock-dongle:
    ports: !reset []

  payment-simulator:
    ports: !reset []

  backend:
    environment:
      # Autorise le frontend statique servi sur ce VPS (port 80) à appeler l'API --
      # voir CorsConfig.java, en plus des motifs localhost/RFC1918 déjà autorisés en dev.
      EXTRA_CORS_ORIGINS: "http://${DEPLOY_PUBLIC_IP:-87.106.7.58}"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "http://${DEPLOY_PUBLIC_IP:-87.106.7.58}:8080"
        VITE_USE_MOCK_API: "false"
    ports:
      - "80:80"
    depends_on:
      - backend
